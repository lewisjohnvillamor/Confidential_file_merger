<!doctype html>
<!--
  Source for docs/banner-light.png and docs/banner-dark.png (the README banner).
  Rendered with the Chromium that ships with Playwright, twice, once per colour scheme:

    node docs/render-banner.js

  Keep the palette in step with the one in static/index.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confidential File Merger banner</title>
<style>
  :root {
    --bg: #f4f2ec; --panel: #fffdf8; --ink: #1d1c19; --ink-2: #5b5852; --ink-3: #8c877d;
    --line: #e3ded2; --line-2: #cfc8b8; --accent: #1f6f5f; --accent-soft: #e2f0eb; --ok: #2f7a4d;
    --glow: rgba(31, 111, 95, .14); --mark-shadow: rgba(29, 28, 25, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2124; --ink: #ecebe6; --ink-2: #b4b1a9; --ink-3: #7f7c74;
      --line: #2f3236; --line-2: #45494f; --accent: #4fb39a; --accent-soft: #1d3530; --ok: #6cc08d;
      --glow: rgba(79, 179, 154, .13); --mark-shadow: rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    width: 1280px; height: 360px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    position: relative; width: 1280px; height: 360px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; text-align: center;
    /* A card, like the panels in the GUI: hairline border, gentle radius. */
    border: 1px solid var(--line); border-radius: 22px;
    background:
      radial-gradient(760px 300px at 50% 6%, var(--glow), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--panel) 70%, var(--bg)) 0%, var(--bg) 62%);
  }
  .mark {
    width: 84px; height: 84px; margin-bottom: 22px;
    filter: drop-shadow(0 6px 18px var(--mark-shadow));
  }
  h1 {
    margin: 0; font-size: 58px; line-height: 1.05; font-weight: 700; letter-spacing: -.022em;
  }
  .tagline {
    margin: 14px 0 0; font-size: 21px; line-height: 1.35; color: var(--ink-2); max-width: 820px;
  }
  .tagline b { color: var(--ink); font-weight: 600; }
  .pills {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 9px; margin-top: 30px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line-2); background: var(--panel);
    font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .pill.lead { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
  }
</style>
</head>
<body>
<div class="banner">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#1f6f5f"/>
    <path d="M9 8h9l5 5v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="#fff"/>
    <path d="M18 8v5h5" fill="#b9e4d6"/>
    <rect x="11" y="16" width="8" height="1.6" rx=".8" fill="#1f6f5f"/>
    <rect x="11" y="19.5" width="6" height="1.6" rx=".8" fill="#1f6f5f"/>
  </svg>
  <h1>Confidential File Merger</h1>
  <p class="tagline">Merge, sign and verify PDFs on your own machine.<br><b>Nothing is ever uploaded to anyone.</b></p>
  <div class="pills">
    <span class="pill lead"><span class="dot"></span>Fully offline</span>
    <span class="pill">PDF + images</span>
    <span class="pill">Digital signatures</span>
    <span class="pill">Rust</span>
    <span class="pill">Apache 2.0</span>
  </div>
</div>
</body>
</html>
