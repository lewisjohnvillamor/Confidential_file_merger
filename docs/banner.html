<!doctype html>
<!--
  Source for docs/banner-light.png and docs/banner-dark.png (the README banner).

  The app itself is the hero: docs/banner-app-{light,dark}.png are real captures of the
  merge queue, made by docs/shoot-app.js. This file only frames them.

  Re-render after editing, once per colour scheme:
    node docs/render-banner.js

  Keep the palette in step with the one in static/index.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confidential File Merger banner</title>
<style>
  :root {
    --bg: #f4f2ec; --panel: #fffdf8; --panel-2: #f7f4ed; --ink: #1d1c19; --ink-2: #5b5852;
    --ink-3: #8c877d; --line: #e3ded2; --line-2: #cfc8b8; --accent: #1f6f5f; --ok: #2f7a4d;
    --glow: rgba(31, 111, 95, .14);
    --mark-shadow: rgba(29, 28, 25, .16); --win-shadow: rgba(29, 28, 25, .17);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2124; --panel-2: #26292d; --ink: #ecebe6; --ink-2: #b4b1a9;
      --ink-3: #7f7c74; --line: #2f3236; --line-2: #45494f; --accent: #4fb39a; --ok: #6cc08d;
      --glow: rgba(79, 179, 154, .13);
      --mark-shadow: rgba(0, 0, 0, .5); --win-shadow: rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    width: 1280px; height: 580px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    position: relative; width: 1280px; height: 580px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 40px; text-align: center;
    /* A card, like the panels in the GUI: hairline border, gentle radius. */
    border: 1px solid var(--line); border-radius: 22px;
    background:
      radial-gradient(820px 340px at 50% 0%, var(--glow), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--panel) 70%, var(--bg)) 0%, var(--bg) 58%);
  }
  .title { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .mark { width: 46px; height: 46px; filter: drop-shadow(0 4px 12px var(--mark-shadow)); }
  h1 { margin: 0; font-size: 41px; line-height: 1; font-weight: 700; letter-spacing: -.022em; }
  .tagline { margin: 15px 0 0; font-size: 19px; line-height: 1.45; color: var(--ink-2); }
  .tagline b { color: var(--ink); font-weight: 600; }

  /* Browser window around the app capture. Its bottom bleeds off the card. */
  .window {
    width: 1022px; margin-top: 30px;
    border: 1px solid var(--line-2); border-radius: 14px 14px 0 0;
    background: var(--panel-2); overflow: hidden;
    box-shadow: 0 -1px 0 rgba(255, 255, 255, .03), 0 22px 50px -12px var(--win-shadow);
  }
  .chrome {
    position: relative; height: 34px; display: flex; align-items: center; gap: 7px;
    padding: 0 12px; border-bottom: 1px solid var(--line);
  }
  .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
  .url {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
    font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink-3); letter-spacing: .01em;
  }
  .url .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .shot { display: block; width: 1020px; }
</style>
</head>
<body>
<div class="banner">
  <div class="title">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#1f6f5f"/>
      <path d="M9 8h9l5 5v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="#fff"/>
      <path d="M18 8v5h5" fill="#b9e4d6"/>
      <rect x="11" y="16" width="8" height="1.6" rx=".8" fill="#1f6f5f"/>
      <rect x="11" y="19.5" width="6" height="1.6" rx=".8" fill="#1f6f5f"/>
    </svg>
    <h1>Confidential File Merger</h1>
  </div>
  <p class="tagline">Merge, sign and verify PDFs on your own machine.<br><b>Nothing is ever uploaded to anyone.</b></p>
  <div class="window">
    <div class="chrome">
      <i></i><i></i><i></i>
      <span class="url"><span class="dot"></span>localhost:8080</span>
    </div>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="banner-app-dark.png">
      <img class="shot" src="banner-app-light.png" alt="The merge queue: three documents with page counts, ready to merge.">
    </picture>
  </div>
</div>
</body>
</html>
