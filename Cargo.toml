[package]
name = "confidential_file_merger"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Lewis John Villamor"]
description = "Fully offline, self-hosted PDF and image merger with a drag-and-drop web GUI."

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# lopdf's default features add chrono, jiff and time (date parsing we never do); rayon speeds up loading.
lopdf = { version = "0.44", default-features = false, features = ["rayon"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
percent-encoding = "2"
hayro = "0.7"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
tiff = "0.11"
# TLS: rustls with the ring provider (no cmake or Go needed to build, unlike aws-lc-rs).
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
open = "5"
rand = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
